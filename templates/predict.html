{% extends "base.html" %}

{% block title %}{{ t.predict.title }}{% endblock %}

{% block meta %}
<meta name="description" content="{{ t.predict.meta_description }}">
<meta property="og:title" content="{{ t.predict.og_title }}">
<meta property="og:description" content="{{ t.predict.og_description }}">
<meta property="og:type" content="website">
{% endblock %}

{% block content %}

  <!-- Page header -->
  <div class="bg-gradient-to-r from-[#0A1525] to-[#162B48] border-b border-white/8">
    <div class="max-w-5xl mx-auto px-6 py-8">
      <h1 class="font-serif text-2xl md:text-3xl font-semibold text-white">{{ t.predict.heading }}</h1>
      <p class="text-sm text-blue-100/40 mt-2">{{ t.predict.subheading }}</p>
    </div>
  </div>

  <main class="max-w-5xl mx-auto px-4 sm:px-6">

    <section class="py-10">

      <!-- Generation tabs -->
      <div class="flex gap-2 mb-8">
        <button type="button" id="tabGen2" onclick="setGeneration(2)"
          class="gen-tab text-sm font-medium px-4 py-2 rounded-lg border transition-colors">
          {{ t.predict.tab_gen2 }}
        </button>
        <button type="button" id="tabGen3" onclick="setGeneration(3)"
          class="gen-tab text-sm font-medium px-4 py-2 rounded-lg border transition-colors">
          {{ t.predict.tab_gen3 }}
        </button>
      </div>

      <p id="genDescription" class="text-base text-muted leading-relaxed mb-6"></p>

      <div id="gen3Note" class="hidden bg-surface border-l-2 border-gold rounded-r-lg p-4 mb-6">
        <p class="text-sm text-muted leading-relaxed">{{ t.predict.gen3_note }}</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- Form -->
        <div>
          <form id="predictForm" class="border border-divider rounded-lg p-5 space-y-4">

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5">{{ t.predict.label_father_dose }}</label>
                <input type="number" step="0.1" id="fatherDose" value="33.9" required
                  class="w-full px-3 py-2 text-sm font-mono border border-divider rounded-lg text-ink focus:outline-none focus:border-accent transition-colors">
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5">{{ t.predict.label_mother_dose }}</label>
                <input type="number" step="0.1" id="motherDose" value="27.9" required
                  class="w-full px-3 py-2 text-sm font-mono border border-divider rounded-lg text-ink focus:outline-none focus:border-accent transition-colors">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5">{{ t.predict.label_father_dose_available }}</label>
                <select id="fatherDoseAvailable"
                  class="w-full px-3 py-2 text-sm border border-divider rounded-lg text-ink focus:outline-none focus:border-accent transition-colors">
                  <option value="1">{{ t.predict.option_yes }}</option>
                  <option value="0">{{ t.predict.option_no }}</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5">{{ t.predict.label_mother_dose_available }}</label>
                <select id="motherDoseAvailable"
                  class="w-full px-3 py-2 text-sm border border-divider rounded-lg text-ink focus:outline-none focus:border-accent transition-colors">
                  <option value="1">{{ t.predict.option_yes }}</option>
                  <option value="0">{{ t.predict.option_no }}</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5">{{ t.predict.label_sex }}</label>
                <select id="sex"
                  class="w-full px-3 py-2 text-sm border border-divider rounded-lg text-ink focus:outline-none focus:border-accent transition-colors">
                  <option value="1">{{ t.predict.option_male }}</option>
                  <option value="0">{{ t.predict.option_female }}</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1.5">{{ t.predict.label_birth_year }}</label>
                <input type="number" id="birthYear" value="1966" required
                  class="w-full px-3 py-2 text-sm font-mono border border-divider rounded-lg text-ink focus:outline-none focus:border-accent transition-colors">
              </div>
            </div>

            <button type="submit" id="submitBtn"
              class="w-full px-4 py-2.5 bg-accent text-white text-sm font-medium rounded-lg hover:bg-accent/90 transition-colors disabled:opacity-60">
              {{ t.predict.submit }}
            </button>

            <p id="formError" class="hidden text-sm text-red-600"></p>
          </form>
        </div>

        <!-- Results -->
        <div>
          <div id="resultsEmpty" class="border border-dashed border-divider rounded-lg p-5 h-full flex items-center justify-center">
            <p class="text-sm text-faint text-center">{{ t.predict.results_empty }}</p>
          </div>
          <div id="resultsPanel" class="hidden space-y-4"></div>
        </div>

      </div>
    </section>

  </main>

{% endblock %}

{% block scripts %}
<script>window.I18N = {{ t.predict.js | tojson }};</script>
<script src="/static/js/predict.js"></script>
{% endblock %}
